name: CI

# 主分支推送 / 合入主分支的 PR / 手动触发：编译 debug 包并留档
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧任务自动取消，省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设置、licenses 已接受），只补齐 platform 35
      - name: 补齐 Android SDK platform 35
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -n "$SDKMANAGER" ]; then
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" \
              || echo "::warning::sdkmanager 安装未成功，交给 Gradle 自动下载"
          else
            echo "::warning::未找到 sdkmanager，交给 Gradle 自动下载缺失的 SDK 组件"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
      # gradle.properties 里写死了作者本机的 org.gradle.java.home，其他机器上会让构建直接失败
      - name: 去掉本机 JDK 路径
        run: |
          sed -i '/^org\.gradle\.java\.home/d' gradle.properties
          chmod +x gradlew

      - name: 编译 debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: qbank-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
