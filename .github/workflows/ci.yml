name: CI

# 主分支推送 / 合入主分支的 PR / 手动触发：编译 debug 包并留档
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧任务自动取消，省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK platform 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # gradle.properties 里写死了作者本机的 org.gradle.java.home，其他机器上会让构建直接失败
      - name: 去掉本机 JDK 路径
        run: |
          sed -i '/^org\.gradle\.java\.home/d' gradle.properties
          chmod +x gradlew

      - name: 编译 debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: qbank-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
