name: Release

# 推送 v* tag（或手动指定 tag）时：编译 release 包、生成校验和、发布 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的 tag（如 v1.0.1）'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: version
        run: |
          TAG='${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}'
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设置、licenses 已接受），只补齐 platform 35
      - name: 补齐 Android SDK platform 35
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -n "$SDKMANAGER" ]; then
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" \
              || echo "::warning::sdkmanager 安装未成功，交给 Gradle 自动下载"
          else
            echo "::warning::未找到 sdkmanager，交给 Gradle 自动下载缺失的 SDK 组件"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: 去掉本机 JDK 路径
        run: |
          sed -i '/^org\.gradle\.java\.home/d' gradle.properties
          chmod +x gradlew

      # 仓库 Secrets 里配了 QBANK_KEYSTORE_BASE64 就用正式签名，没配则退到 debug 签名（仍可直接安装）
      - name: 准备签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.QBANK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 QBANK_KEYSTORE_BASE64，本次 release 使用 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "QBANK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 编译 release APK
        env:
          QBANK_KEYSTORE_PASSWORD: ${{ secrets.QBANK_KEYSTORE_PASSWORD }}
          QBANK_KEY_ALIAS: ${{ secrets.QBANK_KEY_ALIAS }}
          QBANK_KEY_PASSWORD: ${{ secrets.QBANK_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ github.run_number }}"

      - name: 整理产物
        run: |
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "产物：$APK"
          cp "$APK" "out/qbank-${{ steps.version.outputs.name }}.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            out/*.apk
            out/SHA256SUMS.txt
