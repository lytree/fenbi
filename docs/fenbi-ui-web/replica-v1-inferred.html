<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>粉笔 Web 端 · 答题 / 解析界面复刻</title>
<style>
:root{
  --blue:#3c7cfc; --blue-soft:#eff2fe; --blue-soft2:#ebf1fe; --blue-line:#c9d8fd;
  --green:#2bc8a0; --green-soft:#f4fcfa; --green-line:#bfece0;
  --red:#ff5a5a; --red-soft:#fff7f7; --red-line:#ffd6d6;
  --ink:#32343a; --ink2:#636e92; --ink3:#9ea5bb; --ink4:#afb6bc;
  --line:#dde0e5; --line-soft:#eef0f4;
  --bg:#f7f8fa; --fill:#f2f2f5; --fill2:#f5f7fa;
  --orange:#ff7a00;
  --sh:0 1px 2px rgba(16,24,40,.04), 0 10px 28px -18px rgba(16,24,40,.18);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
b,strong{font-weight:600}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d8dce4;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#c4c9d4}
::-webkit-scrollbar-track{background:transparent}

/* ---------------- topbar ---------------- */
.topbar{
  height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;
  background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:30;
}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.tb-center{position:absolute;left:50%;transform:translateX(-50%)}
.tb-right{display:flex;align-items:center;gap:2px;flex:none}
.pt{min-width:0}
.pt-main{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(46vw,520px)}
.pt-sub{font-size:11px;color:var(--ink3);margin-top:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);transition:.14s;position:relative}
.icon-btn:hover{background:var(--fill2);color:var(--ink)}
.icon-btn.on{background:var(--blue-soft);color:var(--blue)}
.icon-btn.on.flag{background:#fff4e8;color:var(--orange)}
.icon-btn .dot-mark{position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--orange);display:none}
.icon-btn.has-mark .dot-mark{display:block}
.timer{
  display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;
  background:var(--fill2);color:var(--ink3);font-variant-numeric:tabular-nums;font-size:13px;
}
.timer .t-val{font-size:14px;font-weight:600;color:var(--ink2)}
.timer.warn{background:#fff3f3}
.timer.warn,.timer.warn .t-val,.timer.warn .ic{color:var(--red)}
.btn{
  height:34px;padding:0 16px;border-radius:6px;font-size:14px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.14s;white-space:nowrap;
}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(60,124,252,.24)}
.btn-primary:hover{background:#2f6ceb}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#c7ccd6;background:#fafbfc}
.btn-soft{background:var(--blue-soft);color:var(--blue)}
.btn-soft:hover{background:#e6ecfe}
.btn-sm{height:30px;padding:0 12px;font-size:13px;border-radius:6px}
.btn-block{width:100%;height:40px}

/* ---------------- layout ---------------- */
.body{height:calc(100vh - 56px);display:flex;overflow:hidden}
.stage{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 24px 28px;scroll-behavior:smooth}
.stage.is-split{display:flex;overflow:hidden;padding:16px 20px 20px}

/* ---------------- sheet ---------------- */
.sheet{
  max-width:860px;margin:0 auto;background:#fff;border:1px solid var(--line-soft);
  border-radius:12px;padding:26px 32px 24px;box-shadow:var(--sh);
}
.split{display:flex;gap:16px;flex:1;height:100%;min-height:0;width:100%;max-width:1480px;margin:0 auto}
.mat,.pane{background:#fff;border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--sh);overflow-y:auto;padding:24px 26px}
.mat{width:42%;flex:none}
.pane{flex:1;min-width:0;display:flex;flex-direction:column}
.pane>*{flex:0 0 auto}
.pane .q-foot{margin-top:auto}
.mat-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tag{
  height:21px;padding:0 7px;border-radius:3px;background:var(--blue-soft);color:var(--blue);
  font-size:11px;font-weight:500;display:inline-flex;align-items:center;flex:none;letter-spacing:.2px;
}
.mat-title{font-size:13px;color:var(--ink2);font-weight:500}
.mat-body{font-size:13.5px;line-height:1.95;color:#3d424a;text-align:justify}
.mat-body p{margin:0 0 10px}
.mat-body table{width:100%;border-collapse:collapse;font-size:12px;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.mat-body th,.mat-body td{border:1px solid var(--line-soft);padding:7px 8px;text-align:right}
.mat-body th:first-child,.mat-body td:first-child{text-align:left}
.mat-body th{background:var(--fill2);font-weight:600;color:var(--ink2);text-align:center;white-space:nowrap;font-size:11.5px}
.mat-body th:first-child{text-align:left}
.mat-body .cap{font-size:12px;color:var(--ink3);margin-top:2px}

/* ---------------- question ---------------- */
.q-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.q-no{font-size:17px;font-weight:700;letter-spacing:.2px}
.q-meta{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.stem{font-size:15.5px;line-height:1.9;color:#2b2e33;text-align:justify}
.stem .sub{display:block;margin-top:8px;color:var(--ink2);font-size:14px}
.figs{display:flex;align-items:center;gap:14px;margin:18px 0 8px;flex-wrap:wrap}
.figs .fig{width:72px;height:72px}
.figs .arrow{color:var(--ink4);font-size:14px}
.figs .unknown{width:72px;height:72px;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--ink4);font-size:18px}

.options{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.options.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
.opt{
  display:flex;gap:11px;padding:8px 14px 8px 9px;border:1px solid transparent;border-radius:8px;
  cursor:pointer;align-items:flex-start;transition:background .14s,border-color .14s;
}
.opt:hover{background:var(--fill2);border-color:#e5e8ee}
.opt .dot{
  width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--ink2);
  font-size:13px;font-weight:600;display:grid;place-items:center;flex:none;margin-top:1px;transition:.14s;
}
.opt .txt{font-size:15px;line-height:1.75;padding-top:1px}
.opt .txt .fig{width:88px;height:88px;margin-top:2px}
.opt:has(.fig){position:relative;justify-content:center;padding:14px 12px}
.opt:has(.fig) .dot{position:absolute;left:12px;top:12px;margin:0}
.opt:has(.fig) .txt{padding-top:0}
.opt.sel{background:var(--blue-soft);border-color:var(--blue-line)}
.opt.sel .dot{background:var(--blue);color:#fff}
.opt.right{background:var(--green-soft);border-color:var(--green-line)}
.opt.right .dot{background:var(--green);color:#fff}
.opt.wrong{background:var(--red-soft);border-color:var(--red-line)}
.opt.wrong .dot{background:var(--red);color:#fff}
.opt.dim{opacity:.72}

.q-foot{display:flex;align-items:center;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line-soft)}
.q-foot .hint{font-size:12.5px;color:var(--ink3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-foot .btn{flex:none}
.q-foot .spacer{flex:1}

/* ---------------- solution ---------------- */
.result{
  display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:8px;margin-bottom:20px;
  font-size:13.5px;font-weight:500;
}
.result .ic{width:17px;height:17px}
.result.ok{background:var(--green-soft);color:#1aa07f;box-shadow:inset 0 0 0 1px var(--green-line)}
.result.no{background:var(--red-soft);color:#e04b4b;box-shadow:inset 0 0 0 1px var(--red-line)}
.result.miss{background:var(--fill2);color:var(--ink2);box-shadow:inset 0 0 0 1px #e6e9ef}
.result .r-sub{margin-left:auto;font-size:12px;font-weight:400;color:var(--ink3)}

.compare{display:flex;border-radius:8px;overflow:hidden;background:var(--fill2);margin-top:18px}
.cmp{flex:1;display:flex;align-items:center;gap:7px;padding:11px 16px;font-size:13.5px;color:var(--ink2)}
.cmp+.cmp{border-left:1px solid #e8ebf1}
.cmp b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.cmp .g{color:var(--green)}
.cmp .r{color:var(--red)}
.cmp .none{color:var(--ink3);font-size:13px;font-weight:400}

.stats{display:flex;margin-top:12px;border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;background:#fff}
.stats .st{flex:1;padding:12px 8px;text-align:center}
.stats .st+.st{border-left:1px solid var(--line-soft)}
.stats .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stats .v i{font-size:11px;font-weight:500;font-style:normal;margin-left:1px}
.stats .k{font-size:11.5px;color:var(--ink3);margin-top:3px}
.blue{color:var(--blue)} .green{color:var(--green)} .red{color:var(--red)}

.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:#2b2e33;margin-bottom:12px}
.sec-h::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--blue);flex:none}
.sec-h .ic{color:var(--ink3);width:16px;height:16px;margin-left:auto;cursor:pointer;transition:.2s}
.sec-h.collapsed .ic{transform:rotate(180deg)}
.sec-h .badge{margin-left:auto;font-size:11px;font-weight:400;color:var(--ink3)}

.analysis{font-size:14px;line-height:1.95;color:#3b4048;text-align:justify}
.analysis p{margin:0 0 10px}
.analysis .hl{color:var(--blue);font-weight:600}
.analysis .tip{background:var(--fill2);border-left:2px solid var(--blue-line);padding:10px 14px;border-radius:0 6px 6px 0;font-size:13px;color:var(--ink2);margin:12px 0}
.analysis .kv{display:flex;gap:8px;margin-top:10px}
.analysis .kv b{color:var(--ink2);font-weight:500;flex:none}

.video{display:flex;gap:14px;padding:10px;border:1px solid var(--line-soft);border-radius:10px;transition:.14s;cursor:pointer}
.video:hover{border-color:var(--blue-line);background:#fbfcff}
.video .cover{
  width:196px;aspect-ratio:16/9;flex:none;border-radius:7px;position:relative;overflow:hidden;
  background:radial-gradient(120% 120% at 20% 0%,#3d5687 0%,#22304d 46%,#131a2b 100%);
  display:grid;place-items:center;color:#fff;
}
.video .cover .play{
  width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);color:#233052;
  display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.28);
}
.video .cover .play .ic{width:14px;height:14px;margin-left:1px}
.video .cover .dur{
  position:absolute;right:6px;bottom:6px;font-size:10.5px;padding:1px 5px;border-radius:3px;
  background:rgba(0,0,0,.55);color:#fff;font-variant-numeric:tabular-nums;
}
.video .cover .poster-txt{position:absolute;left:10px;top:8px;font-size:11px;color:rgba(255,255,255,.72);letter-spacing:.4px}
.video .v-info{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.video .v-t{font-size:14px;font-weight:500;color:var(--ink);line-height:1.5}
.video .v-m{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.stars{color:#ffb43a;letter-spacing:1px;font-size:11px}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:28px;padding:0 12px;border-radius:14px;background:var(--fill2);color:var(--ink2);font-size:12.5px;display:inline-flex;align-items:center}
.pill.blue{background:var(--blue-soft);color:var(--blue)}

.gblock{background:var(--fill2);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--ink2);line-height:1.7}
.gblock .src-t{color:var(--ink);font-size:13px}

.similar{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#f4f8ff,#fbfcff);border:1px solid #e6eeff;border-radius:10px;padding:14px 16px}
.similar .s-t{flex:1;font-size:13px;color:var(--ink2);line-height:1.65}
.similar .s-t b{color:var(--ink);font-weight:600}

.note-row{display:flex;align-items:center;gap:10px;background:var(--fill2);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--ink2)}
.note-row .note-body{flex:1;color:var(--ink);font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.note-row.empty .note-body{color:var(--ink3)}

.ai-row{display:flex;align-items:center;gap:10px;margin-top:26px;padding:12px 14px;border-radius:10px;background:linear-gradient(90deg,#f3f7ff,#f7f4ff);border:1px solid #e8e9ff}
.ai-row .ic{color:#6e5bd8}
.ai-row .ai-t{flex:1;font-size:13px;color:var(--ink2)}
.ai-row .ai-t b{color:var(--ink)}

/* ---------------- panel ---------------- */
.panel{width:336px;flex:none;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column}
.pn-head{padding:18px 20px 10px;display:flex;align-items:center;gap:8px}
.pn-title{font-size:15px;font-weight:600}
.pn-count{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.pn-count b{color:var(--blue);font-size:14px}
.legend{display:flex;gap:14px;padding:0 20px 12px;font-size:11.5px;color:var(--ink2);border-bottom:1px solid var(--line-soft)}
.lg{display:flex;align-items:center;gap:5px}
.lg i{width:10px;height:10px;border-radius:3px;display:block}
.lg i.a{background:var(--blue-soft2);box-shadow:inset 0 0 0 1px var(--blue)}
.lg i.b{background:var(--fill)}
.lg i.c{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.lg i.ok{background:var(--green-soft);box-shadow:inset 0 0 0 1px var(--green)}
.lg i.no{background:var(--red-soft);box-shadow:inset 0 0 0 1px var(--red)}
.pn-body{flex:1;overflow-y:auto;padding:4px 20px 12px}
.sec-label{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink3);margin:14px 0 8px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.num{
  height:auto;aspect-ratio:1/1;border-radius:6px;background:var(--fill);color:var(--ink2);
  font-size:14px;font-weight:500;display:grid;place-items:center;position:relative;
  transition:.12s;font-variant-numeric:tabular-nums;outline:none;
}
.num:focus-visible{outline:2px solid #c9d8fd;outline-offset:2px}
.num:hover{color:var(--ink);background:#ebedf1}
.num.done{background:var(--blue-soft2);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.num.ok{background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.num.no{background:var(--red-soft);color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.num.cur{box-shadow:inset 0 0 0 1px var(--blue),0 0 0 2px #dbe6ff;font-weight:600}
.num.flag::after{
  content:"";position:absolute;top:-1px;right:-1px;width:0;height:0;
  border-top:9px solid var(--orange);border-left:9px solid transparent;border-top-right-radius:6px;
}
.pn-foot{padding:14px 20px 18px;border-top:1px solid var(--line-soft);background:#fff}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .3s}
.pn-stat{font-size:12px;color:var(--ink3);margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
.pn-stat b{color:var(--ink2);font-weight:500}

/* ---------------- overlays ---------------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;z-index:100;animation:fade .16s ease}
.mask[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{width:392px;background:#fff;border-radius:12px;padding:22px 24px 18px;box-shadow:0 24px 60px -20px rgba(16,24,40,.4);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.dlg-h{font-size:16px;font-weight:600;margin-bottom:8px}
.dlg-b{font-size:13.5px;color:var(--ink2);line-height:1.8}
.dlg-b .kv{display:flex;gap:18px;margin-top:12px;background:var(--fill2);border-radius:8px;padding:12px 14px}
.dlg-b .kv div{flex:1}
.dlg-b .kv .k{font-size:11.5px;color:var(--ink3)}
.dlg-b .kv .v{font-size:16px;font-weight:600;color:var(--ink)}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dialog textarea{
  width:100%;height:104px;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  font:inherit;font-size:13.5px;line-height:1.7;resize:vertical;outline:none;color:var(--ink);
}
.dialog textarea:focus{border-color:var(--blue-line);box-shadow:0 0 0 3px rgba(60,124,252,.1)}

.menu{
  position:absolute;top:52px;right:14px;width:172px;background:#fff;border:1px solid var(--line);
  border-radius:8px;box-shadow:0 12px 32px -12px rgba(16,24,40,.28);padding:6px;z-index:60;
}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--ink2)}
.menu button:hover{background:var(--fill2);color:var(--ink)}
.menu .sep{height:1px;background:var(--line-soft);margin:5px 8px}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:rgba(32,36,44,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;
  transition:.22s;z-index:200;max-width:80vw;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){ .pt-main{max-width:34vw} }
@media (max-width:980px){
  .panel{display:none}
  .tb-center{position:static;transform:none;margin-left:8px}
}
@media (max-width:860px){
  .stage{padding:12px}
  .sheet{padding:20px 18px}
  .split{flex-direction:column}
  .mat{width:auto;max-height:38vh}
  .options.grid2{grid-template-columns:1fr}
  .pt-main{max-width:30vw}
}
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.6V12l3 2"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4"/><path d="M6 5h9.5l-1.3 3.4L15.5 12H6z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4.4l2.35 4.86 5.15.7-3.76 3.7.94 5.3L12 16.42 7.32 18.96l.94-5.3-3.76-3.7 5.15-.7z"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5l-4-4L4 16z"/><path d="M13.6 6.4l4 4"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>

  /* ---------- 弹窗 ---------- */
  function openDialog(html) {
    $('#dialog').innerHTML = html;
    $('#mask').hidden = false;
  }
  function closeDialog() {
    $('#mask').hidden = true;
    $('#dialog').innerHTML = '';
  }

  function confirmSubmit() {
    var a = answeredCount();
    openDialog(
      '<div class="dlg-h">确认交卷？</div>' +
      '<div class="dlg-b">交卷后答案不可修改，系统会立即批改并展开全部解析。' +
      '<div class="kv">' +
      '<div><div class="k">已作答</div><div class="v">' + a + ' 题</div></div>' +
      '<div><div class="k">未作答</div><div class="v">' + (TOTAL - a) + ' 题</div></div>' +
      '<div><div class="k">剩余时间</div><div class="v">' + fmt(state.remaining) + '</div></div>' +
      '</div></div>' +
      '<div class="dlg-f"><button class="btn btn-ghost" data-dlg="cancel">再检查一下</button>' +
      '<button class="btn btn-primary" data-dlg="ok">确认交卷</button></div>'
    );
  }

  function submit() {
    state.mode = 'solution';
    closeDialog();
    stopTimer();
    var right = 0, wrong = 0;
    QUESTIONS.forEach(function (q) {
      var m = state.answers[q.no];
      if (m) { if (m === q.ans) right++; else wrong++; }
    });
    render();
    $('#stage').scrollTop = 0;
    toast('已交卷：答对 ' + right + ' 题，答错 ' + wrong + ' 题，未答 ' + (TOTAL - right - wrong) + ' 题');
  }

  function openNote() {
    var q = cur();
    openDialog(
      '<div class="dlg-h">本题笔记</div>' +
      '<div class="dlg-b">笔记会同步到错题本与个人中心，支持在解析页回看。</div>' +
      '<textarea id="noteTa" placeholder="记录解题思路、易错点或需要回看的知识点…">' + esc(state.notes[q.no] || '') + '</textarea>' +
      '<div class="dlg-f"><button class="btn btn-ghost" data-dlg="cancel">取消</button>' +
      '<button class="btn btn-primary" data-dlg="save-note">保存笔记</button></div>'
    );
    setTimeout(function () { var ta = $('#noteTa'); if (ta) ta.focus(); }, 30);
  }

  /* ---------- 计时 ---------- */
  function stopTimer() {
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
  }
  function startTimer() {
    stopTimer();
    state.timerId = setInterval(function () {
      if (state.mode !== 'answer') return;
      state.remaining -= 1;
      if (state.remaining <= 0) {
        state.remaining = 0;
        renderTop();
        stopTimer();
        toast('考试时间到，系统已自动交卷');
        state.mode = 'solution';
        render();
        return;
      }
      renderTop();
    }, 1000);
  }

  /* ---------- 事件 ---------- */
  function bind() {
    $('#stage').addEventListener('click', function (e) {
      var opt = e.target.closest('.opt');
      if (opt) { choose(opt.dataset.k); return; }
      var nav = e.target.closest('[data-nav]');
      if (nav) { goto(state.idx + (nav.dataset.nav === 'next' ? 1 : -1)); return; }
      var head = e.target.closest('.sec-h');
      if (head) {
        head.classList.toggle('collapsed');
        var body = head.nextElementSibling;
        if (body) body.hidden = !body.hidden;
        return;
      }
      var act = e.target.closest('[data-act]');
      if (act) {
        var a = act.dataset.act;
        if (a === 'note') return openNote();
        if (a === 'play') return toast('视频解析：复刻环境未接入播放器');
        if (a === 'practice') return toast('举一反三：已生成 5 道同类题');
        if (a === 'ai') return toast('AI 老师：正在根据你的作答生成讲解');
      }
    });

    $('#pnBody').addEventListener('click', function (e) {
      var n = e.target.closest('.num');
      if (!n) return;
      var no = parseInt(n.dataset.no, 10);
      goto(QUESTIONS.findIndex(function (q) { return q.no === no; }));
    });

    $('#btnFlag').addEventListener('click', function () {
      var no = cur().no;
      if (state.flags[no]) { delete state.flags[no]; toast('已取消标记'); }
      else { state.flags[no] = true; toast('已标记本题，可在答题卡中快速定位'); }
      render(true);
    });
    $('#btnFav').addEventListener('click', function () {
      var no = cur().no;
      if (state.favs[no]) { delete state.favs[no]; toast('已取消收藏'); }
      else { state.favs[no] = true; toast('已收藏本题'); }
      render(true);
    });
    $('#btnNote').addEventListener('click', openNote);

    $('#btnSubmit').addEventListener('click', function () {
      if (state.mode === 'solution') { toast('练习报告页不在本次复刻范围'); return; }
      confirmSubmit();
    });
    $('#btnSubmit2').addEventListener('click', function () {
      if (state.mode === 'solution') { toast('练习报告页不在本次复刻范围'); return; }
      confirmSubmit();
    });

    $('#btnBack').addEventListener('click', function () {
      toast(state.mode === 'solution' ? '返回练习报告' : '退出后进度会自动保存，下次可继续作答');
    });

    $('#btnMore').addEventListener('click', function (e) {
      e.stopPropagation();
      var m = $('#menu');
      m.hidden = !m.hidden;
      if (!m.hidden) {
        var r = $('#btnMore').getBoundingClientRect();
        m.style.top = r.bottom + 6 + 'px';
        m.style.right = (window.innerWidth - r.right) + 'px';
      }
    });
    $('#menu').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      var act = b.dataset.act;
      $('#menu').hidden = true;
      if (act === 'draft') toast('草稿纸：复刻环境未实现画笔');
      if (act === 'fix') toast('已提交纠错，教研会在 24 小时内复核');
      if (act === 'dark') toast('粉笔 Web 端支持深色模式（本次复刻未开放）');
    });
    document.addEventListener('click', function () { $('#menu').hidden = true; });

    $('#mask').addEventListener('click', function (e) {
      if (e.target.id === 'mask') return closeDialog();
      var b = e.target.closest('[data-dlg]');
      if (!b) return;
      var act = b.dataset.dlg;
      if (act === 'cancel') return closeDialog();
      if (act === 'ok') return submit();
      if (act === 'save-note') {
        var v = ($('#noteTa') || {}).value || '';
        if (v.trim()) state.notes[cur().no] = v.trim();
        else delete state.notes[cur().no];
        closeDialog();
        render(true);
        toast(v.trim() ? '笔记已保存' : '笔记已清空');
      }
    });

    document.addEventListener('keydown', function (e) {
      if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (e.key === 'Escape') { closeDialog(); $('#menu').hidden = true; return; }
      if (e.key === 'ArrowLeft') { goto(state.idx - 1); return; }
      if (e.key === 'ArrowRight') { goto(state.idx + 1); return; }
      var k = e.key.toUpperCase();
      if ('ABCD'.indexOf(k) > -1) {
        var q = cur();
        if (q.opts.some(function (o) { return o.k === k; })) choose(k);
      }
      if (k === 'F') { $('#btnFlag').click(); }
      if (k === 'S') { $('#btnFav').click(); }
    });
  }

  /* ---------- 启动 ---------- */
  function boot() {
    var params = new URLSearchParams(location.search);
    var qp = parseInt(params.get('q'), 10);
    if (qp && qp >= 1 && qp <= TOTAL) state.idx = qp - 1;
    if (params.get('mode') === 'solution') state.mode = 'solution';

    bind();
    render();
    if (state.mode === 'answer') startTimer();
    else $('#tVal').textContent = fmt(state.remaining);
  }

  boot();
})();
</script>
</body>
</html>
