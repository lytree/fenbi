<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>粉笔 Web 端 · 答题 / 解析 / 记录</title>
<style>
/* ===== 设计令牌：取自 fenbi.com 实测（亮色） ===== */
:root{
  --blue:#3c7cfc;
  --blue-bg:rgba(60,124,252,.08);
  --blue-tag-bg:rgba(60,124,252,.15);
  --blue-tag-text:#4775fe;
  --green:#2bc8a0;
  --green-bg:rgba(43,200,160,.10);
  --red:#ff5a5a;
  --red-bg:rgba(255,90,90,.09);
  --orange:#ff7a00;
  --bg:#f8f9fd;
  --card:#ffffff;
  --ink:rgba(0,0,0,.85);
  --ink-strong:#1b2126;
  --muted:rgba(0,0,0,.45);
  --muted2:rgba(0,0,0,.30);
  --line:rgba(0,0,0,.06);
  --fill:#f5f6fa;
  --fill2:#f2f4f8;
  --radius:8px;
  --sh:0 2px 10px rgba(20,32,60,.05);
  --bar-h:60px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
b,strong{font-weight:600}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#dcdfe8;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#c9cdd9}
::-webkit-scrollbar-track{background:transparent}

/* ===== 顶栏 60px ===== */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:40;
  display:flex;align-items:center;background:#fff;border-bottom:1px solid var(--line);
  padding-left:max(20px,calc((100vw - 1150px) / 2));
  padding-right:max(20px,calc((100vw - 1150px) / 2));
}
.tb-left{display:flex;align-items:center;gap:16px;flex:1;min-width:0}
.tb-title{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:14px;color:var(--ink-strong);max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tb-right{display:flex;align-items:center;gap:8px;flex:none}
.tb-btn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;
  font-size:14px;color:var(--ink);transition:.14s;
}
.tb-btn:hover{background:var(--fill)}
.tb-btn .ic{width:16px;height:16px;color:var(--muted)}
.tb-btn.submit{font-weight:500}
.tb-btn.submit .ic{color:var(--ink)}
.back-btn{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--ink)}
.back-btn:hover{background:var(--fill)}
.timer{display:inline-flex;align-items:center;gap:6px;height:26px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer .ic{width:15px;height:15px;color:var(--muted)}
.timer .pause{width:18px;height:18px;border-radius:3px;display:grid;place-items:center;color:var(--muted);margin-left:2px}
.timer .pause:hover{background:var(--fill);color:var(--ink)}
.timer.warn,.timer.warn .ic{color:var(--red)}
.timer[hidden]{display:none}

/* ===== 内容容器 1150 ===== */
.wrap{max-width:1150px;margin:0 auto;padding:80px 0 140px}

/* ===== 模块卡 ===== */
.module{
  position:relative;background:var(--card);border-radius:var(--radius);padding:18px 20px 16px;
  margin-bottom:12px;box-shadow:var(--sh);overflow:hidden;
}
.module::after{
  content:"";position:absolute;right:0;top:0;width:280px;height:100%;
  background:radial-gradient(120% 130% at 100% 0%,rgba(60,124,252,.14) 0%,rgba(60,124,252,.05) 42%,rgba(60,124,252,0) 74%);
  pointer-events:none;
}
.module h2{position:relative;z-index:1;margin:0 0 6px;font-size:16px;font-weight:600;color:var(--ink-strong)}
.module p{position:relative;z-index:1;margin:0;font-size:13px;color:var(--muted);line-height:1.8}

/* ===== 材料卡 ===== */
.material{position:relative;background:var(--card);border-radius:var(--radius);padding:18px 20px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mtag{height:22px;padding:0 10px;border-radius:4px;background:var(--blue-tag-bg);color:var(--blue-tag-text);font-size:12px;line-height:22px;display:inline-flex;align-items:center}
.mt{font-size:13px;color:var(--muted)}
.mb{font-size:14px;line-height:1.95;color:var(--ink);text-align:justify}
.mb p{margin:0 0 10px}
.mb table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0;font-variant-numeric:tabular-nums}
.mb th,.mb td{border:1px solid var(--line);padding:8px 10px;text-align:right}
.mb th{background:var(--fill);color:var(--muted);font-weight:500;text-align:center;white-space:nowrap}
.mb th:first-child,.mb td:first-child{text-align:left}

/* ===== 题目卡 ===== */
.ti{
  position:relative;background:var(--card);border-radius:var(--radius);
  padding:0 20px 20px;margin-bottom:12px;box-shadow:var(--sh);
}
.ti-head{display:flex;align-items:center;height:50px;gap:10px;padding:0 10px;margin:0 -10px}
.ti-head .no{font-size:15px;color:var(--ink-strong);font-weight:500;min-width:18px}
.tag{
  height:22px;padding:0 10px;border-radius:4px;background:var(--blue-tag-bg);color:var(--blue-tag-text);
  font-size:12px;line-height:22px;display:inline-flex;align-items:center;flex:none;
}
.ti-tools{margin-left:auto;display:flex;align-items:center;gap:2px}
.ti-tools .t{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted2);transition:.14s}
.ti-tools .t:hover{background:var(--fill);color:var(--ink)}
.ti-tools .t.on{color:var(--orange)}
.ti-tools .t.on.star{color:#ffb43a}
.ti-tools .ic{width:17px;height:17px}

.q-stem{font-size:15px;line-height:1.95;color:var(--ink);text-align:justify;padding:0 2px}
.q-stem .sub{display:block;margin-top:6px;color:var(--muted);font-size:14px}
.q-stem p{margin:0 0 8px}
.q-figs{display:flex;align-items:center;gap:14px;margin:14px 0 4px;flex-wrap:wrap}
.q-figs .fig{width:74px;height:74px}
.q-figs .unknown{width:74px;height:74px;border:1px dashed rgba(0,0,0,.15);border-radius:6px;display:grid;place-items:center;color:var(--muted2);font-size:18px}

/* 选项 */
.opts{margin-top:22px;display:flex;flex-direction:column;gap:32px}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px}
.opt{
  display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;border-radius:6px;
  cursor:pointer;transition:background .14s;border:1px solid transparent;
}
.opt:hover{background:var(--fill)}
.opt .dot{
  width:30px;height:30px;border-radius:50%;flex:none;
  background:var(--fill2);color:var(--muted);font-size:14px;
  display:grid;place-items:center;transition:.14s;border:1px solid transparent;
}
.opt .txt{font-size:15px;line-height:1.7;color:var(--ink);min-width:0}
.opt .txt .fig{width:84px;height:84px}
.opt.sel{background:var(--blue-bg);border-color:rgba(60,124,252,.25)}
.opt.sel .dot{background:var(--blue);color:#fff}
.opt:has(.fig){justify-content:center;position:relative;padding:12px}
.opt:has(.fig) .dot{position:absolute;left:12px;top:12px}
/* 解析态 */
.opt.right{background:var(--green-bg)}
.opt.right .dot{background:var(--green);color:#fff}
.opt.wrong{background:var(--red-bg)}
.opt.wrong .dot{background:var(--red);color:#fff}
.opt.ans-only .dot{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.opt.ans-only .txt{color:var(--green)}

/* ===== 解析页 ===== */
.report-grid{display:grid;grid-template-columns:1fr 372px;gap:12px;margin-bottom:12px}
.score-card,.dist-card,.exam-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--sh)}
.score-card{padding:18px 20px 16px}
.sc-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sc-head .ic{width:16px;height:16px;color:var(--blue)}
.sc-head h3{margin:0;font-size:15px;font-weight:600;color:var(--ink-strong)}
.diff{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);background:var(--fill);padding:4px 10px;border-radius:12px}
.sc-main{display:flex;align-items:flex-end;gap:6px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sc-score{font-size:34px;font-weight:600;color:var(--blue);line-height:1;font-variant-numeric:tabular-nums}
.sc-total{font-size:14px;color:var(--muted);padding-bottom:2px}
.sc-time{margin-left:auto;text-align:right;padding-bottom:2px}
.sc-time .v{font-size:16px;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.sc-time .k{font-size:12px;color:var(--muted)}
.sc-label{font-size:12px;color:var(--muted);margin-top:6px}
.sc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sc-cell{background:var(--fill);border-radius:8px;padding:10px 12px;position:relative;overflow:hidden}
.sc-cell .v{font-size:19px;font-weight:600;color:var(--ink-strong);line-height:1.2;font-variant-numeric:tabular-nums}
.sc-cell .k{font-size:12px;color:var(--muted);margin-top:2px}
.sc-cell .deco{position:absolute;right:10px;top:50%;transform:translateY(-50%);opacity:.45}

.dist-card{padding:18px}
.dist-card h3{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--ink-strong);display:flex;align-items:center;gap:8px}
.dist-card h3 .ic{width:16px;height:16px;color:var(--blue)}
.dist-chart{height:152px}

.exam-card{padding:16px 20px 6px;margin-bottom:12px}
.exam-card .ec-h{font-size:15px;font-weight:600;color:var(--ink-strong);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.exam-card .ec-h .ic{width:16px;height:16px;color:var(--blue)}
.ec-row{display:flex;align-items:center;gap:10px;height:44px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.ec-row:last-child{border-bottom:0}
.ec-row .name{display:flex;align-items:center;gap:8px;color:var(--ink);min-width:0}
.ec-row .ico{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--fill);color:var(--muted)}
.ec-row .ico.total{background:rgba(255,122,0,.12);color:var(--orange)}
.ec-row .ico.green{background:rgba(43,200,160,.14);color:var(--green)}
.ec-row .stat{margin-left:auto;display:flex;align-items:center;gap:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ec-row .stat b{font-weight:500;color:var(--ink)}
.ec-row .stat .g{color:var(--green)}
.ec-row .stat .r{color:var(--red)}
.ec-row .stat .chip{background:var(--fill);padding:2px 8px;border-radius:4px;color:var(--ink)}

/* 逐题解析卡 */
.ti.sol{overflow:hidden}
.ti.sol.ok{background:linear-gradient(180deg,rgba(43,200,160,.11) 0,rgba(43,200,160,.11) 50px,#fff 50px)}
.ti.sol.no{background:linear-gradient(180deg,rgba(255,90,90,.09) 0,rgba(255,90,90,.09) 50px,#fff 50px)}

.overall{display:grid;grid-template-columns:repeat(4,1fr);background:var(--fill);border-radius:8px;margin-top:18px;padding:12px 0}
.ov{text-align:center;position:relative}
.ov+.ov::before{content:"";position:absolute;left:0;top:14%;height:72%;width:1px;background:rgba(0,0,0,.06)}
.ov .v{font-size:18px;font-weight:600;line-height:1.35;font-variant-numeric:tabular-nums}
.ov .k{font-size:12px;color:var(--muted);margin-top:2px}
.ov .v.g{color:var(--green)}
.ov .v.r{color:var(--red)}
.ov .v.b{color:var(--blue)}
.ov .v.o{color:var(--orange)}

.sol-box{margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sol-h{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;background:#fff;cursor:pointer}
.sol-h .bar{width:3px;height:14px;border-radius:2px;background:var(--blue)}
.sol-h .t{font-size:16px;font-weight:500;color:var(--ink-strong)}
.sol-h .ic{margin-left:auto;color:var(--muted);transition:.2s}
.sol-box.collapsed .sol-h .ic{transform:rotate(-90deg)}
.sol-body{padding:0 16px 16px;font-size:15px;line-height:2;color:var(--ink);text-align:justify}
.sol-box.collapsed .sol-body{display:none}
.sol-body p{margin:0 0 10px}
.sol-body .hl{color:var(--blue);font-weight:600}
.kps{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.kp{height:40px;padding:8px 20px;border-radius:20px;background:var(--blue);color:#fff;font-size:15px;display:inline-flex;align-items:center}
.note{margin-top:14px}
.note-row{display:flex;align-items:center;gap:12px;background:var(--fill);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted)}
.note-row .nb{flex:1;color:var(--ink);font-size:13px;white-space:pre-wrap;word-break:break-word}
.note-row.empty .nb{color:var(--muted)}
.note-row .btn{height:30px;padding:0 14px;border-radius:15px;font-size:13px;background:rgba(60,124,252,.10);color:var(--blue)}

/* ===== 底部答题卡 ===== */
.answer-card{
  position:fixed;left:50%;bottom:0;width:1150px;max-width:calc(100vw - 40px);height:252px;
  background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -4px 24px rgba(20,32,60,.10);
  transform:translate(-50%,calc(100% - 58px));transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:50;
  display:flex;flex-direction:column;
}
.answer-card.open{transform:translate(-50%,0)}
.answer-card[hidden]{display:none}
.ac-tag{height:58px;display:flex;align-items:center;gap:8px;padding:0 22px;cursor:pointer;flex:none}
.ac-tag .t{font-size:15px;font-weight:600;color:var(--ink-strong)}
.ac-tag .c{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ac-tag .chev{margin-left:6px;color:var(--muted);transition:.25s}
.answer-card.open .ac-tag .chev{transform:rotate(180deg)}
.ac-tools{margin-left:auto;display:flex;gap:2px}
.ac-tools .t{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted2)}
.ac-tools .t:hover{background:var(--fill);color:var(--ink)}
.ac-body{flex:1;overflow-y:auto;padding:0 22px 20px;border-top:1px solid var(--line)}
.ac-sec{margin-top:16px}
.ac-sec h4{margin:0 0 10px;font-size:13px;font-weight:400;color:var(--muted)}
.ac-grid{display:grid;grid-template-columns:repeat(15,36px);gap:20px}
.ab{
  width:36px;height:36px;border-radius:6px;background:var(--fill2);color:var(--muted);
  font-size:13px;display:grid;place-items:center;position:relative;transition:.12s;font-variant-numeric:tabular-nums;
}
.ab:hover{color:var(--ink)}
.ab.done{background:rgba(60,124,252,.12);color:var(--blue);box-shadow:inset 0 0 0 1px rgba(60,124,252,.55)}
.ab.ok{background:var(--green);color:#fff}
.ab.no{background:var(--red);color:#fff}
.ab.cur{box-shadow:inset 0 0 0 2px var(--blue)}
.ab.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--orange);border:2px solid #fff}

/* ===== 记录页 ===== */
.rec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.rec-head h1{margin:0;font-size:20px;font-weight:600;color:var(--ink-strong)}
.rec-head .sub{font-size:13px;color:var(--muted)}
.rec-filters{margin-left:auto;display:flex;gap:8px}
.chip-btn{height:30px;padding:0 14px;border-radius:15px;background:#fff;color:var(--muted);font-size:13px;border:1px solid var(--line)}
.chip-btn.on{background:rgba(60,124,252,.10);color:var(--blue);border-color:rgba(60,124,252,.30);font-weight:500}
.rec-list{display:flex;flex-direction:column;gap:10px}
.rec-item{
  background:#fff;border-radius:10px;padding:16px 20px;box-shadow:var(--sh);cursor:pointer;
  display:flex;align-items:center;gap:18px;transition:.14s;border:1px solid transparent;
}
.rec-item:hover{border-color:rgba(60,124,252,.28);box-shadow:0 6px 20px rgba(20,32,60,.08)}
.rec-main{min-width:0;flex:1}
.rec-title{font-size:15px;color:var(--ink-strong);font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec-title .st{font-size:12px;padding:1px 7px;border-radius:3px;font-weight:400}
.st.done{background:rgba(43,200,160,.12);color:var(--green)}
.st.doing{background:rgba(60,124,252,.12);color:var(--blue)}
.st.abandon{background:var(--fill);color:var(--muted)}
.rec-meta{font-size:12.5px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.rec-meta b{font-weight:500;color:var(--ink)}
.rec-score{text-align:right;flex:none}
.rec-score .v{font-size:22px;font-weight:600;color:var(--blue);line-height:1.2;font-variant-numeric:tabular-nums}
.rec-score .k{font-size:12px;color:var(--muted)}
.rec-arrow{color:var(--muted2);flex:none}

.detail-head{background:#fff;border-radius:10px;padding:18px 22px;box-shadow:var(--sh);margin-bottom:12px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.detail-head .t{font-size:17px;font-weight:600;color:var(--ink-strong)}
.detail-head .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.detail-head .nums{margin-left:auto;display:flex;gap:26px}
.detail-head .n{text-align:center}
.detail-head .n .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.detail-head .n .k{font-size:12px;color:var(--muted)}
.back-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);margin-bottom:12px}
.back-link:hover{color:var(--blue)}
.empty-state{background:#fff;border-radius:10px;padding:56px 20px;text-align:center;color:var(--muted);box-shadow:var(--sh)}

/* ===== 弹窗 / toast ===== */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.42);display:grid;place-items:center;z-index:100}
.mask[hidden]{display:none}
.dialog{width:392px;background:#fff;border-radius:14px;padding:24px;box-shadow:0 24px 60px -18px rgba(16,24,40,.35)}
.dlg-h{font-size:17px;font-weight:600;color:var(--ink-strong);margin-bottom:8px}
.dlg-b{font-size:13.5px;color:var(--muted);line-height:1.8}
.dlg-kv{display:flex;background:var(--fill);border-radius:8px;padding:12px 14px;margin-top:14px}
.dlg-kv div{flex:1;text-align:center}
.dlg-kv .k{font-size:11.5px;color:var(--muted)}
.dlg-kv .v{font-size:16px;font-weight:600;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.btn{height:36px;padding:0 18px;border-radius:18px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.14s}
.btn-ghost{background:var(--fill);color:var(--ink)}
.btn-ghost:hover{background:#e9ecf3}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#2f6ceb}
.dialog textarea{width:100%;height:96px;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px;resize:vertical;outline:none}
.dialog textarea:focus{border-color:rgba(60,124,252,.45);box-shadow:0 0 0 3px rgba(60,124,252,.1)}
.toast{
  position:fixed;left:50%;bottom:300px;transform:translate(-50%,10px);opacity:0;pointer-events:none;
  background:rgba(32,36,44,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;transition:.22s;z-index:200;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1200px){
  .wrap{max-width:100%;padding:76px 20px 140px}
  .answer-card{width:calc(100vw - 40px)}
  .ac-grid{grid-template-columns:repeat(10,36px)}
}
@media (max-width:900px){
  .report-grid{grid-template-columns:1fr}
  .tb-title{display:none}
  .overall{grid-template-columns:repeat(2,1fr);row-gap:12px}

      '<div class="meta">' + r.date + ' · ' + r.mode + ' · ' + (r.status === 'done' ? '已交卷' : '已放弃') + '</div></div>' +
      '<div class="nums">' +
      '<div class="n"><div class="v" style="color:var(--blue)">' + sc.score.toFixed(1) + '</div><div class="k">得分</div></div>' +
      '<div class="n"><div class="v" style="color:var(--green)">' + sc.right + '</div><div class="k">答对</div></div>' +
      '<div class="n"><div class="v" style="color:var(--red)">' + sc.wrong + '</div><div class="k">答错</div></div>' +
      '<div class="n"><div class="v" style="color:var(--muted)">' + sc.miss + '</div><div class="k">未答</div></div>' +
      '<div class="n"><div class="v">' + r.dur + '</div><div class="k">用时</div></div>' +
      '</div></div>';
    h += reportHtml(sc, r.dur, r.durSec);
    QUESTIONS.forEach(function (q) { h += tiHtml(q); });
    h += '</div>';
    $('#main').innerHTML = h;
    activeAnswers = state.answers;
  }

  /* ---- 调度 ---- */
  function render() {
    renderTop();
    if (state.view === 'exam') renderExam();
    else if (state.view === 'solution') renderSolution();
    else if (state.view === 'records') renderRecords();
    else if (state.view === 'record') renderRecord();
    renderAnswerCard();
  }

  /* ---- 弹窗 ---- */
  function openDialog(html) { $('#dialog').innerHTML = html; $('#mask').hidden = false; }
  function closeDialog() { $('#mask').hidden = true; $('#dialog').innerHTML = ''; }

  function confirmSubmit() {
    var a = answeredCount();
    openDialog('<div class="dlg-h">确认交卷？</div>' +
      '<div class="dlg-b">' + (a < TOTAL ? '你还有题目未做完，确认交卷吗？' : '交卷后将无法修改答案。') +
      '<div class="dlg-kv"><div><div class="k">已作答</div><div class="v">' + a + '</div></div>' +
      '<div><div class="k">未作答</div><div class="v">' + (TOTAL - a) + '</div></div>' +
      '<div><div class="k">用时</div><div class="v">' + fmt(state.elapsed || 0) + '</div></div></div></div>' +
      '<div class="dlg-f"><button class="btn btn-ghost" data-dlg="cancel">取消</button>' +
      '<button class="btn btn-primary" data-dlg="ok">确认</button></div>');
  }

  function submitPaper() {
    stopTimer();
    var now = new Date();
    var rec = {
      id: 'r' + Date.now(),
      title: PAPER_TITLE,
      date: now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()),
      mode: '模考大赛',
      status: 'done',
      answers: JSON.parse(JSON.stringify(state.answers)),
      dur: fmtCN(state.elapsed || 0),
      durSec: state.elapsed || 0
    };
    RECORDS.unshift(rec);
    closeDialog();
    state.view = 'solution';
    state.answers = rec.answers;
    activeAnswers = state.answers;
    render();
    window.scrollTo(0, 0);
    var sc = scoreOf(rec.answers);
    toast('已交卷：答对 ' + sc.right + ' 题，答错 ' + sc.wrong + ' 题，得 ' + sc.score.toFixed(1) + ' 分');
  }

  function openNote(no) {
    var q = QUESTIONS[no - 1];
    openDialog('<div class="dlg-h">第 ' + no + ' 题 · 笔记</div>' +
      '<div class="dlg-b">笔记会同步到错题本与个人中心。</div>' +
      '<textarea id="noteTa" placeholder="记录解题思路、易错点…">' + esc(state.notes[no] || '') + '</textarea>' +
      '<div class="dlg-f"><button class="btn btn-ghost" data-dlg="cancel">取消</button>' +
      '<button class="btn btn-primary" data-dlg="save-note" data-q="' + no + '">保存</button></div>');
    setTimeout(function () { var t = $('#noteTa'); if (t) t.focus(); }, 30);
  }

  /* ---- 计时 ---- */
  function stopTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } }
  function startTimer() {
    stopTimer();
    state.elapsed = 0;
    state.timerId = setInterval(function () {
      state.elapsed = (state.elapsed || 0) + 1;
      var el = $('#tVal');
      if (el) el.textContent = fmt(state.elapsed);
    }, 1000);
  }

  /* ---- 事件 ---- */
  function bind() {
    document.addEventListener('click', function (e) {
      var opt = e.target.closest('.opt');
      if (opt && state.view === 'exam') {
        state.answers[opt.dataset.q] = opt.dataset.opt;
        render();
        return;
      }
      var tool = e.target.closest('[data-tool]');
      if (tool) {
        var no = +tool.dataset.q;
        var kind = tool.dataset.tool;
        if (kind === 'flag') {
          if (state.flags[no]) delete state.flags[no]; else state.flags[no] = true;
          render(); toast(state.flags[no] ? '已标记第 ' + no + ' 题' : '已取消标记');
        } else if (kind === 'star') {
          if (state.stars[no]) delete state.stars[no]; else state.stars[no] = true;
          render(); toast(state.stars[no] ? '已收藏' : '已取消收藏');
        } else if (kind === 'note') {
          openNote(no);
        }
        return;
      }
      var tog = e.target.closest('[data-toggle]');
      if (tog) {
        var n = +tog.dataset.toggle;
        state.collapsed[n] = !state.collapsed[n];
        render();
        return;
      }
      var jump = e.target.closest('[data-jump]');
      if (jump) {
        var target = document.getElementById('ti-' + jump.dataset.jump);
        if (target) { target.scrollIntoView({ block: 'start', behavior: 'smooth' }); window.scrollBy(0, -70); }
        $('#answerCard').classList.remove('open');
        return;
      }
      var rec = e.target.closest('[data-rec]');
      if (rec) {
        state.recordId = rec.dataset.rec;
        state.view = 'record';
        render(); window.scrollTo(0, 0);
        return;
      }
      var back = e.target.closest('[data-back]');
      if (back) { state.view = back.dataset.back; render(); window.scrollTo(0, 0); return; }

      var top = e.target.closest('[data-top]');
      if (top) {
        var a = top.dataset.top;
        if (a === 'submit') return confirmSubmit();
        if (a === 'records') { state.view = 'records'; render(); window.scrollTo(0, 0); return; }
        if (a === 'setting') return toast('设置：夜间模式 / 字号 / 自动下一题（演示）');
        if (a === 'download') return toast('下载试卷：仅考试模式下可用');
      }
      var ac = e.target.closest('[data-ac]');
      if (ac) {
        var act = ac.dataset.ac;
        if (act === 'flag' || act === 'note' || act === 'star') {
          toast('请先在题目右侧操作具体题目');
        }
        return;
      }
    });

    $('#acTag').addEventListener('click', function (e) {
      if (e.target.closest('[data-ac]')) return;
      $('#answerCard').classList.toggle('open');
    });

    $('#btnBack').addEventListener('click', function () {
      if (state.view === 'record') { state.view = 'records'; render(); window.scrollTo(0, 0); return; }
      if (state.view === 'solution') { state.view = 'records'; render(); window.scrollTo(0, 0); return; }
      if (state.view === 'records') { state.view = 'exam'; render(); window.scrollTo(0, 0); startTimer(); return; }
      toast('退出后进度自动保存，下次可继续作答');
    });

    $('#mask').addEventListener('click', function (e) {
      if (e.target.id === 'mask') return closeDialog();
      var b = e.target.closest('[data-dlg]');
      if (!b) return;
      var act = b.dataset.dlg;
      if (act === 'cancel') return closeDialog();
      if (act === 'ok') return submitPaper();
      if (act === 'save-note') {
        var v = ($('#noteTa') || {}).value || '';
        var q = b.dataset.q;
        if (v.trim()) state.notes[q] = v.trim(); else delete state.notes[q];
        closeDialog(); render();
        toast(v.trim() ? '笔记已保存' : '笔记已清空');
      }
    });

    document.addEventListener('keydown', function (e) {
      if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (e.key === 'Escape') { closeDialog(); $('#answerCard').classList.remove('open'); }
      if (state.view !== 'exam') return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') return;
    });
  }

  /* ---- 启动 ---- */
  function boot() {
    var hash = (location.hash || '').replace('#', '');
    var qs = new URLSearchParams(location.search);
    var view = qs.get('view');
    if (hash.indexOf('records') === 0) state.view = 'records';
    if (view === 'records') state.view = 'records';
    if (view === 'solution') {
      state.view = 'solution';
      if (!Object.keys(state.answers).length) {
        var demo = 'B,C,C,B,D,A,B,C,C,B,C,A,A,A,D,C,A,A,B,C'.split(',');
        QUESTIONS.forEach(function (q, i) { state.answers[q.no] = demo[i]; });
      }
    }
    state.elapsed = qs.get('t') ? parseInt(qs.get('t'), 10) : (state.view === 'exam' ? 0 : 298);
    activeAnswers = state.answers;
    bind();
    render();
    if (state.view === 'exam') startTimer();
  }
  window.__fb = { state: state, RECORDS: RECORDS, QUESTIONS: QUESTIONS, render: function () { render(); } };
  boot();
})();
</script>
</body>
