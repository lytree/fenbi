org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 国内镜像偶发 5xx / 连接挂起。超时收紧，让 Gradle 快速失败并重试下一个仓库，
# 而不是卡在一次 socket 上干等（默认连接超时较长）。
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 8.7 / Kotlin 2.0 不支持 JDK 25（IllegalArgumentException: 25.0.3），本项目要求 JDK 21。
# 本机 JDK 路径不写在这里——org.gradle.java.home 是各人机器相关的配置，写进仓库会在别人的
# 机器上直接让构建失败（CI 也只能 sed 掉）。需要固定 JDK 时放到 ~/.gradle/gradle.properties：
#   org.gradle.java.home=<你的 JDK 21 目录>
